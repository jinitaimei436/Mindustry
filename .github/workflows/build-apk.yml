name: Build Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: |
          if [ -f VERSION ]; then V=$(tr -d '[:space:]' < VERSION); else V=$(git rev-parse --short HEAD); fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building Mindustry v$V"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Clone Arc dependency
        run: git clone --depth=1 --branch=master https://github.com/Anuken/Arc ../Arc

      - name: Install Android SDK packages
        run: |
          set -e
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          ls "$ANDROID_HOME/platforms"

      # AGP 8.2 bug: with no java resources the "mergeDebugJavaResource" task is NO-SOURCE,
      # so R8 fails with NoSuchFileException on merged_java_res/debug/base.jar.
      # Providing one java resource makes the task produce base.jar. R8 must stay ENABLED:
      # it performs default-interface-method desugaring, without which the app crashes
      # with AbstractMethodError: arc.Application.addListener on launch.
      - name: Provide java resource (works around AGP merged_java_res bug)
        run: |
          mkdir -p android/src/main/resources/mindustry
          echo "mindustry fork build" > android/src/main/resources/mindustry/fork-version.txt
          find android/src/main/resources -type f

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew android:assembleDebug --stacktrace --no-daemon

      - name: Verify APK contains desugared companion classes
        run: |
          APK=$(ls android/build/outputs/apk/debug/*.apk | head -1)
          echo "apk: $APK"
          unzip -p "$APK" 'classes*.dex' > /tmp/all.dex
          if grep -a -q 'Application\$-CC' /tmp/all.dex; then echo 'DESUGAR-OK: companion classes present'; else echo 'WARN: no \$-CC companion found'; fi
          ls -l "$APK"

      - name: Rename APK with version
        run: |
          mkdir -p out
          for f in android/build/outputs/apk/debug/*.apk; do cp "$f" "out/mindustry-v${{ steps.ver.outputs.version }}-debug.apk"; done
          ls -l out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mindustry-${{ steps.ver.outputs.version }}-debug-apk
          path: out/*.apk
          retention-days: 14
