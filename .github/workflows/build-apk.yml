name: Build Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Clone Arc dependency
        run: git clone --depth=1 --branch=master https://github.com/Anuken/Arc ../Arc

      - name: Install Android SDK packages
        run: |
          set -e
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          ls "$ANDROID_HOME/platforms"

      - name: Relax R8 for debug build
        run: |
          sed -i 's/minifyEnabled = true/minifyEnabled = false/; s/shrinkResources = true/shrinkResources = false/' android/build.gradle
          grep -n "minifyEnabled\|shrinkResources" android/build.gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew android:assembleDebug --stacktrace --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mindustry-global-logistics-debug-apk
          path: android/build/outputs/apk/debug/*.apk
          retention-days: 30
