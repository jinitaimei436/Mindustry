name: Build Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: |
          if [ -f VERSION ]; then V=$(tr -d '[:space:]' < VERSION); else V=$(git rev-parse --short HEAD); fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building Mindustry v$V"

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Clone Arc dependency
        run: git clone --depth=1 --branch=master https://github.com/Anuken/Arc ../Arc

      - name: Install Android SDK packages
        run: |
          set -e
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          ls "$ANDROID_HOME/platforms"

      # --- 关键修复 1: AGP 8.2.2 的 R8 读不到 merged_java_res/base.jar，升级到 8.13.2
      # 千万不要用 minifyEnabled=false 绕过：R8 同时负责 default interface method 脱糖，
      # 关掉后启动即 AbstractMethodError: arc.Application.addListener
      - name: Upgrade Android Gradle Plugin
        run: |
          sed -i "s#com.android.tools.build:gradle:8.2.2#com.android.tools.build:gradle:8.13.2#" android/build.gradle
          grep -n "com.android.tools.build:gradle" android/build.gradle

      - name: Provide java resource
        run: |
          mkdir -p android/src/main/resources/mindustry
          echo "build" > android/src/main/resources/mindustry/fork-version.txt

      - uses: gradle/actions/setup-gradle@v4

      # --- 关键修复 2: android/build.gradle 只让 assembleDebug 依赖 :tools:pack，
      # 没约束 mergeDebugAssets，导致图集在 assets 打包之后才生成，APK 里缺
      # sprites.aatlas/.aatls，进主菜单时崩: FileNotFoundException sprites/sprites.aatls
      - name: Pack sprite atlases
        run: |
          chmod +x gradlew
          ./gradlew tools:pack --stacktrace --no-daemon
          ls -l core/assets/sprites/*.aatl* || true

      - name: Build Debug APK
        run: ./gradlew android:assembleDebug --stacktrace --no-daemon

      - name: Verify APK (desugaring + sprite atlas)
        run: |
          APK=$(ls android/build/outputs/apk/debug/*.apk | head -1)
          echo "apk: $APK"
          unzip -l "$APK" | grep -E 'assets/sprites/sprites.aatl' || (echo 'FATAL: sprite atlas missing from APK'; exit 1)
          unzip -p "$APK" 'classes*.dex' > /tmp/all.dex
          grep -a -q 'Application\$-CC' /tmp/all.dex || (echo 'FATAL: default interface methods not desugared'; exit 1)
          echo 'VERIFY-OK: atlas + desugared companions present'

      - name: Rename APK with version
        run: |
          mkdir -p out
          for f in android/build/outputs/apk/debug/*.apk; do cp "$f" "out/mindustry-v${{ steps.ver.outputs.version }}-debug.apk"; done
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: mindustry-${{ steps.ver.outputs.version }}-debug-apk
          path: out/*.apk
          retention-days: 14
